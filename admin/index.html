<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ทุ่งหวาย · จัดการการจอง</title>
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="theme-color" content="#2e4a38">
<link rel="apple-touch-icon" href="/images/admin-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ทุ่งหวาย Admin">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --dusk:#152227; --pine:#2e4a38; --lantern:#e8963e; --glow:#f6c877;
  --cream:#f5efe3; --ink:#24312c; --red:#c74b3c; --ok:#3d8b5f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sarabun',sans-serif;background:var(--dusk);color:var(--cream);font-size:16px;padding-bottom:90px}
h1,h2,h3,button{font-family:'Mitr',sans-serif}
header{position:sticky;top:0;z-index:30;background:var(--pine);padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
header h1{font-size:1.05rem;color:var(--glow);flex:1}
header button{background:none;border:none;color:var(--cream);font-size:1.3rem;cursor:pointer}
.wrap{padding:14px 12px;max-width:1100px;margin:0 auto}
.btn{display:inline-block;border:none;border-radius:999px;padding:11px 20px;font-size:.95rem;font-weight:500;cursor:pointer}
.btn-l{background:var(--lantern);color:var(--dusk)}
.btn-g{background:transparent;border:1.5px solid rgba(246,200,119,.5);color:var(--cream)}
.btn-r{background:var(--red);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:.78rem;padding:3px 10px;border-radius:999px;background:rgba(246,200,119,.15);color:var(--glow)}

/* ---- setup / form cards ---- */
.card{background:rgba(245,239,227,.06);border:1px solid rgba(246,200,119,.25);border-radius:14px;padding:18px 16px;margin:14px 0}
.card h2{color:var(--glow);font-size:1.05rem;margin-bottom:10px}
label{display:block;font-size:.85rem;opacity:.85;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(246,200,119,.35);background:rgba(21,34,39,.6);color:var(--cream);font-size:16px;font-family:'Sarabun',sans-serif}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lantern)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{margin-top:10px;font-size:.9rem;padding:10px 12px;border-radius:10px;display:none}
.msg.err{display:block;background:rgba(199,75,60,.2);color:#ffb0a5}
.msg.ok{display:block;background:rgba(61,139,95,.2);color:#9fe0bd}

/* ---- cinema grid ---- */
.gridbox{overflow-x:auto;border:1px solid rgba(246,200,119,.25);border-radius:14px;background:rgba(245,239,227,.04)}
table.cal{border-collapse:collapse;min-width:100%}
.cal th,.cal td{border:1px solid rgba(246,200,119,.12);padding:0;height:44px}
.cal th{background:rgba(21,34,39,.9);font-family:'Mitr';font-weight:500;font-size:.72rem;color:var(--glow);padding:6px 4px;min-width:46px;position:sticky;top:0}
.cal th.today{background:var(--lantern);color:var(--dusk)}
.cal td.roomname,.cal th.roomname{position:sticky;left:0;background:var(--pine);min-width:96px;max-width:110px;font-size:.78rem;padding:4px 8px;z-index:5;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal td.free{background:transparent;cursor:pointer}
.cal td.free:active{background:rgba(246,200,119,.25)}
.cal td.busy{background:var(--lantern);cursor:pointer;position:relative}
.cal td.busy.start{border-radius:10px 0 0 10px}
.cal td.busy.end{border-radius:0 10px 10px 0}
.cal td.busy .nm{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:.72rem;color:var(--dusk);font-weight:600;white-space:nowrap;overflow:hidden;max-width:400%;z-index:2}
.cal td.past{opacity:.35}
.legend{display:flex;gap:14px;font-size:.8rem;opacity:.8;margin:8px 2px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}

/* ---- bottom sheet ---- */
.sheet{position:fixed;left:0;right:0;bottom:-100%;background:var(--pine);border-radius:18px 18px 0 0;padding:20px 18px 30px;z-index:50;transition:bottom .25s ease;box-shadow:0 -8px 30px rgba(0,0,0,.5);max-height:85vh;overflow-y:auto}
.sheet.open{bottom:0}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.backdrop.show{display:block}
.list{margin-top:6px}
.bk{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(246,200,119,.15);font-size:.9rem}
.bk .d{color:var(--glow);font-family:'Mitr';font-size:.8rem;min-width:88px}
.fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;background:var(--lantern);color:var(--dusk);font-size:2rem;border:none;box-shadow:0 6px 20px rgba(232,150,62,.5);cursor:pointer;z-index:35;line-height:1}
.loading{text-align:center;padding:30px;opacity:.7}
/* tabs 2 มุมมอง */
.tabs{display:flex;gap:8px;margin:2px 0 14px}
.tabs button{flex:1;font-family:'Mitr';font-size:.95rem;padding:11px;border-radius:12px;border:1.5px solid rgba(246,200,119,.35);background:transparent;color:var(--cream);cursor:pointer}
.tabs button.on{background:var(--lantern);border-color:var(--lantern);color:var(--dusk);font-weight:600}
/* log รายวัน (ตามวันที่รับจอง) */
.bk.log{display:block;padding:12px 4px;line-height:1.8}
.bk.log .r1{font-size:1rem}
.bk.log .r1 b{color:var(--glow)}
.bk.log small{opacity:.75}
.bk.log .cancelled{color:#ffb0a5}
/* detail แบบกางครบ */
#dBody .ln{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(246,200,119,.15);font-size:.95rem}
#dBody .ln .k{flex:none;width:96px;opacity:.7;font-size:.85rem}
#dBody .ln .v{flex:1;word-break:break-word}
#dBody .ln .v a{color:var(--glow)}
</style>
</head>
<body>

<header>
  <h1>ทุ่งหวายโฮมสเตย์ · การจอง <small style="opacity:.5;font-size:.6em;font-weight:400">v4.3</small></h1>
  <span class="pill" id="whoami"></span>
  <button id="btnRefresh" title="โหลดใหม่">⟳</button>
  <button id="btnUsers" title="จัดการผู้ใช้" style="display:none">👥</button>
  <button id="btnSettings" title="ออกจากระบบ / สลับผู้ใช้">⚙︎</button>
</header>

<div class="wrap">

  <!-- จอเข้าสู่ระบบ -->
  <div class="card" id="setupCard" style="display:none">
    <h2>เข้าสู่ระบบ</h2>
    <label>ชื่อผู้ใช้</label>
    <input id="cfgUser" autocomplete="username" placeholder="เช่น admin">
    <label>รหัสผ่าน</label>
    <input id="cfgPass" type="password" autocomplete="current-password">
    <div style="margin-top:14px"><button class="btn btn-l" id="cfgSave">เข้าสู่ระบบ</button></div>
    <div class="msg" id="cfgMsg"></div>
  </div>

  <!-- ผังห้อง -->
  <div id="board" style="display:none">
    <div class="tabs">
      <button id="tabLog">📒 การจอง (ตามวันรับจอง)</button>
      <button id="tabCal">🏠 ห้องว่าง (ตามวันเข้าพัก)</button>
    </div>

    <!-- มุมมองสมุดจองรายวัน -->
    <div id="logView" style="display:none">
      <div class="row" style="margin-bottom:10px">
        <button class="btn btn-g" id="logPrev">← วันก่อน</button>
        <button class="btn btn-g" id="logToday">วันนี้</button>
        <button class="btn btn-g" id="logNext">วันถัดไป →</button>
      </div>
      <div class="card">
        <h2 id="logHead">รับจองวันนี้</h2>
        <div class="list" id="logList"></div>
      </div>
    </div>

    <div id="calView">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <div class="row">
        <button class="btn btn-g" id="prevBtn">← ก่อน</button>
        <button class="btn btn-g" id="todayBtn">วันนี้</button>
        <button class="btn btn-g" id="nextBtn">ถัดไป →</button>
      </div>
      <h2 id="rangeLabel" style="font-size:.95rem;color:var(--glow)"></h2>
    </div>
    <div class="gridbox"><div class="loading" id="loading">กำลังโหลด…</div><table class="cal" id="cal" style="display:none"></table></div>
    <div class="legend">
      <span><i style="background:var(--lantern)"></i>มีจอง (กดดูรายละเอียด)</span>
      <span><i style="background:rgba(245,239,227,.08);border:1px solid rgba(246,200,119,.3)"></i>ว่าง (กดเพื่อจอง)</span>
    </div>

    <div class="card">
      <h2 id="tonightHead">เข้าพักคืนนี้</h2>
      <div class="list" id="tonight"></div>
    </div>

    <div class="card">
      <h2>การจองข้างหน้า</h2>
      <div class="list" id="upcoming"></div>
    </div>
    </div><!-- /calView -->
  </div>
</div>

<button class="fab" id="fabAdd" style="display:none">+</button>

<!-- bottom sheet: ฟอร์มจอง -->
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="formSheet">
  <h2 style="color:var(--glow);margin-bottom:6px">บันทึกการจอง</h2>
  <label>ชื่อลูกค้า *</label><input id="fName">
  <label>เบอร์โทร</label><input id="fPhone" inputmode="tel">
  <label>ห้อง *</label><select id="fRoom"></select>
  <div class="grid2">
    <div><label>เช็คอิน *</label><input id="fIn" type="date"></div>
    <div><label>เช็คเอาท์ *</label><input id="fOut" type="date"></div>
  </div>
  <div class="grid2">
    <div><label>อาหารเช้า</label><select id="fBf"><option value="">ไม่รวมอาหารเช้า</option><option value="1">รวมอาหารเช้า</option></select></div>
    <div><label>เตียงเสริม</label><select id="fXbed"><option value="">ไม่มี</option><option value="1">มี</option></select></div>
  </div>
  <div class="grid2">
    <div><label>มัดจำ (บาท)</label><input id="fDepB" inputmode="numeric" placeholder="0"></div>
    <div><label>มัดจำ (กีบ)</label><input id="fDepK" inputmode="numeric" placeholder="0"></div>
  </div>
  <label>หมายเหตุเพิ่มเติม</label><input id="fNote" placeholder="มากี่คน / รายการอาหาร ฯลฯ">
  <div class="row" style="margin-top:16px">
    <button class="btn btn-l" id="fSave">บันทึกการจอง</button>
    <button class="btn btn-g" id="fClose">ปิด</button>
  </div>
  <div class="msg" id="fMsg"></div>
</div>

<!-- bottom sheet: เอกสารการจอง (รูปส่งลูกค้า) -->
<div class="sheet" id="docSheet">
  <h2 style="color:var(--glow);margin-bottom:10px">เอกสารการจอง</h2>
  <div style="text-align:center"><img id="docImg" style="width:100%;max-width:420px;border-radius:12px;border:1px solid rgba(246,200,119,.3)" alt="เอกสารการจอง"></div>
  <p style="font-size:.82rem;opacity:.7;margin-top:10px">ส่งให้ลูกค้า: กดปุ่มแชร์ หรือกดรูปค้างไว้แล้วบันทึก/แชร์</p>
  <div class="row" style="margin-top:12px;flex-wrap:wrap">
    <button class="btn btn-l" id="docShare">แชร์เอกสาร</button>
    <button class="btn btn-g" id="docSaveImg">บันทึกรูป</button>
    <button class="btn btn-g" id="docSavePdf">บันทึก PDF</button>
    <button class="btn btn-g" id="docPrint">พิมพ์</button>
    <button class="btn btn-g" id="docClose">ปิด</button>
  </div>
  <div class="msg" id="docMsg"></div>
</div>

<!-- bottom sheet: จัดการผู้ใช้ (admin เท่านั้น) -->
<div class="sheet" id="userSheet">
  <h2 style="color:var(--glow);margin-bottom:6px">จัดการผู้ใช้</h2>
  <div class="list" id="userList" style="margin-bottom:14px"></div>
  <h3 style="color:var(--glow);font-size:.95rem;margin-bottom:2px">เพิ่มผู้ใช้ใหม่ (ลูกทีม)</h3>
  <div class="grid2">
    <div><label>ชื่อผู้ใช้</label><input id="uName" placeholder="เช่น นก"></div>
    <div><label>รหัสผ่าน</label><input id="uPass" placeholder="อย่างน้อย 4 ตัว"></div>
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn btn-l" id="uAdd">เพิ่มผู้ใช้</button>
    <button class="btn btn-g" id="uClose">ปิด</button>
  </div>
  <div class="msg" id="uMsg"></div>
</div>

<!-- bottom sheet: รายละเอียดการจอง -->
<div class="sheet" id="detailSheet">
  <h2 style="color:var(--glow)" id="dTitle">รายละเอียด</h2>
  <div id="dBody" style="margin:10px 0;font-size:.95rem;line-height:2"></div>
  <div class="row">
    <button class="btn btn-l" id="dDoc">📄 เอกสารการจอง</button>
    <button class="btn btn-r" id="dCancel">ยกเลิกการจองนี้</button>
    <button class="btn btn-g" id="dClose">ปิด</button>
  </div>
  <div class="msg" id="dMsg"></div>
</div>

<script>
/* ================= config ================= */
const API = '/api';
const store = {
  get user(){ return localStorage.getItem('tw_user') || '' },
  get pass(){ return localStorage.getItem('tw_pass') || '' },
  get role(){ return localStorage.getItem('tw_role') || '' },
  save(u,p,r){ localStorage.setItem('tw_user',u); localStorage.setItem('tw_pass',p); localStorage.setItem('tw_role',r); },
  clear(){ ['tw_user','tw_pass','tw_role','tw_api','tw_pin','tw_staff'].forEach(k=>localStorage.removeItem(k)); }
};
const $ = id => document.getElementById(id);
const DAYS = window.innerWidth < 700 ? 10 : 21;   // จำนวนวันต่อจอ
let viewStart = todayStr();
let rooms = [], bookings = [], logBookings = [], logDate = null, view = 'log';

function todayStr(){ const d=new Date(); return d.toLocaleDateString('sv-SE'); }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return d.toLocaleDateString('sv-SE'); }
function thDate(s){ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('th-TH',{day:'numeric',month:'short'}); }
function thDow(s){ const d=new Date(s+'T00:00:00'); return ['อา','จ','อ','พ','พฤ','ศ','ส'][d.getDay()]; }
function roomName(id){ return (rooms.find(r=>r.id===id)||{}).name || id; }
function nightsOf(b){ return Math.max(1, Math.round((new Date(b.checkout)-new Date(b.checkin))/864e5)); }

async function api(params){
  const u = new URL(API, location.origin);
  u.searchParams.set('user', store.user);
  u.searchParams.set('pass', store.pass);
  Object.entries(params).forEach(([k,v]) => u.searchParams.set(k,v));
  const r = await fetch(u, {redirect:'follow'});
  return r.json();
}

/* ================= boot ================= */
function boot(){
  if(!store.user || !store.pass){ $('setupCard').style.display='block'; return; }
  $('setupCard').style.display='none';
  $('board').style.display='block';
  $('fabAdd').style.display='block';
  $('whoami').textContent = store.user + (store.role==='admin' ? ' · เจ้าของ' : '');
  $('btnUsers').style.display = store.role==='admin' ? 'inline' : 'none';
  load();
  setView(view);
}
$('cfgSave').onclick = async () => {
  const u=$('cfgUser').value.trim(), p=$('cfgPass').value;
  const m=$('cfgMsg'); m.className='msg';
  if(!u || !p){ m.className='msg err'; m.textContent='กรอกชื่อผู้ใช้และรหัสผ่าน'; return; }
  m.className='msg ok'; m.textContent='กำลังเข้าสู่ระบบ…';
  try{
    const url = new URL(API, location.origin);
    url.searchParams.set('action','login'); url.searchParams.set('user',u); url.searchParams.set('pass',p);
    const r = await (await fetch(url, {redirect:'follow'})).json();
    if(!r.ok){ m.className='msg err'; m.textContent=r.error || 'เข้าไม่ได้'; return; }
    store.save(u, p, r.role);
    m.className='msg ok'; m.textContent='เข้าสู่ระบบสำเร็จ ✓';
    $('cfgPass').value='';
    setTimeout(boot, 400);
  }catch(e){ m.className='msg err'; m.textContent='เชื่อมต่อไม่ได้ ลองใหม่'; }
};
$('btnSettings').onclick = () => {
  if(!confirm('ออกจากระบบ / สลับผู้ใช้?')) return;
  store.clear();
  $('board').style.display='none'; $('fabAdd').style.display='none'; $('btnUsers').style.display='none';
  $('whoami').textContent='';
  $('setupCard').style.display='block'; $('cfgUser').value=''; $('cfgPass').value='';
  $('cfgMsg').className='msg';
};

/* ================= เอกสารการจอง (รูปส่งลูกค้า) ================= */
let docBlob = null;
const LOGO = new Image(); LOGO.src = '/images/logo-emblem.png';

function wrapText(ctx, text, x, y, maxW, lh){
  const words = String(text).split(' ');
  let line = '', yy = y;
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line){ ctx.fillText(line, x, yy); line = w; yy += lh; }
    else line = t;
  }
  if (line) ctx.fillText(line, x, yy);
  return yy;
}

async function drawDoc(b){
  try { await document.fonts.ready; } catch(e) {}
  const W = 1000, cv = document.createElement('canvas');
  const rn = roomName(b.room);
  const noteParts = (b.note || '').split(' · ').filter(Boolean);
  const H = 940 + noteParts.length * 44;
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');

  x.fillStyle = '#f7f2e6'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#2e4a38'; x.fillRect(0, 0, W, 200);
  if (LOGO.complete && LOGO.naturalWidth) x.drawImage(LOGO, 60, 40, 120, 120);
  x.fillStyle = '#f6c877'; x.font = '600 46px Mitr';
  x.fillText('ทุ่งหวายโฮมสเตย์', 210, 95);
  x.fillStyle = '#e8e2d2'; x.font = '26px Sarabun';
  x.fillText('ທົ່ງຫວາຍໂຮມສະເຕ · Thongwai Homestay · Paksong', 210, 138);
  x.fillStyle = '#e8963e'; x.fillRect(0, 200, W, 8);

  x.fillStyle = '#24312c'; x.font = '600 40px Mitr';
  x.fillText('เอกสารยืนยันการจอง', 60, 285);
  x.fillStyle = '#6a7268'; x.font = '24px Sarabun';
  x.fillText('Booking Confirmation · ' + b.id, 60, 322);

  let y = 400;
  const row = (k, v, big) => {
    x.fillStyle = '#8a8f85'; x.font = '24px Sarabun'; x.fillText(k, 60, y);
    x.fillStyle = '#24312c'; x.font = (big ? '600 34px Mitr' : '28px Sarabun');
    y = wrapText(x, v, 300, y, W - 360, 38) + 56;
    x.strokeStyle = 'rgba(46,74,56,.15)'; x.setLineDash([6, 8]);
    x.beginPath(); x.moveTo(60, y - 38); x.lineTo(W - 60, y - 38); x.stroke(); x.setLineDash([]);
  };
  row('ผู้เข้าพัก', b.name, true);
  if (b.phone) row('เบอร์โทร', b.phone);
  row('ห้องพัก', rn, true);
  row('เช็คอิน', thDate(b.checkin) + ' (' + thDow(b.checkin) + ')');
  row('เช็คเอาท์', thDate(b.checkout) + ' (' + thDow(b.checkout) + ')');
  row('จำนวนคืน', nightsOf(b) + ' คืน');
  for (const p of noteParts) row('', p);

  x.fillStyle = '#2e4a38'; x.fillRect(0, H - 170, W, 170);
  x.fillStyle = '#9fe0b7'; x.font = '600 30px Mitr';
  x.fillText('✓ ยืนยันการจองแล้ว — ขอบคุณที่เลือกทุ่งหวายโฮมสเตย์', 60, H - 108);
  x.fillStyle = '#e8e2d2'; x.font = '23px Sarabun';
  x.fillText('โทร +856 20 91 555 288 · thongwaihomestay.com · บ้านทุ่งหวาย เมืองปากซอง แขวงจำปาสัก', 60, H - 62);

}

// ── สร้าง PDF เองโดยฝังรูป JPEG (ไม่พึ่งไลบรารี — ฟอนต์ชัวร์เพราะเป็นภาพ) ──
function jpegToPdf(jpegDataUrl, pxW, pxH){
  const jpeg = Uint8Array.from(atob(jpegDataUrl.split(',')[1]), c => c.charCodeAt(0));
  const W = 595.28, H = W * pxH / pxW;                       // กว้าง A4 (พอยต์)
  const enc = new TextEncoder();
  const head = `%PDF-1.4\n`;
  const objs = [];
  objs.push(`1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n`);
  objs.push(`2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj\n`);
  objs.push(`3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W.toFixed(2)} ${H.toFixed(2)} ] /Resources << /XObject << /Im1 4 0 R >> >> /Contents 5 0 R >> endobj\n`);
  const imgHead = `4 0 obj << /Type /XObject /Subtype /Image /Width ${pxW} /Height ${pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >> stream\n`;
  const imgTail = `\nendstream endobj\n`;
  const content = `q ${W.toFixed(2)} 0 0 ${H.toFixed(2)} 0 0 cm /Im1 Do Q`;
  const obj5 = `5 0 obj << /Length ${content.length} >> stream\n${content}\nendstream endobj\n`;

  const parts = [enc.encode(head)];
  const offsets = [0];
  let pos = head.length;
  const pushText = t => { parts.push(enc.encode(t)); pos += t.length; };
  offsets.push(pos); pushText(objs[0]);
  offsets.push(pos); pushText(objs[1]);
  offsets.push(pos); pushText(objs[2]);
  offsets.push(pos); pushText(imgHead); parts.push(jpeg); pos += jpeg.length; pushText(imgTail);
  offsets.push(pos); pushText(obj5);
  const xrefPos = pos;
  let xref = `xref\n0 6\n0000000000 65535 f \n`;
  for (let i = 1; i <= 5; i++) xref += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  xref += `trailer << /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
  pushText(xref);
  return new Blob(parts, { type: 'application/pdf' });
}
function dl(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}
$('docSaveImg').onclick = () => {

  dl(docBlob, 'booking-' + currentId + '.png');

};
$('docSavePdf').onclick = () => {

  dl(pdf, 'booking-' + currentId + '.pdf');

  w.document.close();
};

async function loadUsers(){
  $('userList').innerHTML = '<div style="opacity:.6;padding:6px 2px">กำลังโหลด…</div>';
  const r = await api({action:'users'});
  if(!r.ok){ $('userList').innerHTML = '<div style="opacity:.6">'+r.error+'</div>'; return; }
  $('userList').innerHTML = r.users.map(u => `
    <div class="bk"><span class="d">${u.role==='admin'?'👑 admin':'ลูกทีม'}</span>
      <span style="flex:1"><b>${u.username}</b></span>
      <button class="btn btn-g" style="padding:6px 12px;font-size:.8rem" onclick="setPw('${u.username}')">เปลี่ยนรหัส</button>
      ${u.username!==store.user && u.role!=='admin' ? `<button class="btn btn-r" style="padding:6px 12px;font-size:.8rem" onclick="delUser('${u.username}')">ลบ</button>` : ''}
    </div>`).join('');
}
window.setPw = async username => {
  const p = prompt('รหัสผ่านใหม่ของ "'+username+'" (อย่างน้อย 4 ตัว)');
  if(p === null) return;
  const r = await api({action:'user_setpw', username, password:p});

  if(!r.ok){ m.className='msg err'; m.textContent=r.error; return; }
  m.className='msg ok'; m.textContent='เปลี่ยนรหัสของ '+username+' แล้ว ✓';
  if(username === store.user) store.save(store.user, p, store.role);   // อัปเดตรหัสตัวเองในเครื่อง
};
window.delUser = async username => {
  if(!confirm('ลบผู้ใช้ "'+username+'"? การจองเก่าที่คนนี้บันทึกยังอยู่ครบ')) return;

/* ================= 2 มุมมอง ================= */
function setView(v){
  view = v;
  $('logView').style.display = v==='log' ? 'block' : 'none';
  $('calView').style.display = v==='cal' ? 'block' : 'none';
  $('tabLog').className = v==='log' ? 'on' : '';
  $('tabCal').className = v==='cal' ? 'on' : '';
  if (v==='log' && !logDate){ logDate = todayStr(); loadLog(); }
}
$('tabLog').onclick = () => setView('log');
$('tabCal').onclick = () => setView('cal');
$('logPrev').onclick  = () => { logDate = addDays(logDate, -1); loadLog(); };
$('logNext').onclick  = () => { logDate = addDays(logDate, +1); loadLog(); };
$('logToday').onclick = () => { logDate = todayStr(); loadLog(); };

async function loadLog(){
  $('logHead').textContent = 'รับจองวัน' + thDow(logDate) + 'ที่ ' + thDate(logDate) + ' …';
  $('logList').innerHTML = '<div style="opacity:.6;padding:8px 2px">กำลังโหลด…</div>';
  try{
    const r = await api({action:'booked_on', date:logDate});
    if(!r.ok) throw 0;
    logBookings = r.bookings;
    const act = logBookings.filter(b=>b.status==='จอง');
    $('logHead').textContent = `รับจองวัน${thDow(logDate)}ที่ ${thDate(logDate)} — ${act.length} รายการ` + (logBookings.length>act.length ? ` (+ยกเลิก ${logBookings.length-act.length})` : '');
    $('logList').innerHTML = logBookings.length ? logBookings.map(b => `
      <div class="bk log" onclick="openDetail('${b.id}')">
        <div class="r1"><b>${b.name}</b>${b.phone?` · <a href="tel:${b.phone}" style="color:var(--glow)" onclick="event.stopPropagation()">${b.phone}</a>`:''}${b.status!=='จอง'?' <span class="cancelled">· ยกเลิกแล้ว</span>':''}</div>
        <div>🏠 ${roomName(b.room)} · 📅 เข้า ${thDate(b.checkin)} → ออก ${thDate(b.checkout)} (${nightsOf(b)} คืน)</div>
        ${b.note?`<div><small>📝 ${b.note}</small></div>`:''}
        <div><small>รับจองโดย ${b.staff||'-'} · ${b.created}</small></div>
      </div>`).join('') : '<div style="opacity:.6;padding:8px 2px">ไม่มีการรับจองวันนี้</div>';
  }catch(e){
    $('logList').innerHTML = '<div style="opacity:.6;padding:8px 2px">โหลดไม่สำเร็จ ลองกด ⟳</div>';
  }
}

/* ================= data ================= */
async function load(){
  $('loading').style.display='block'; $('cal').style.display='none';
  try{
    const [rr, rb] = await Promise.all([
      api({action:'rooms'}),
      api({action:'bookings', from:addDays(viewStart,-60), to:addDays(viewStart, DAYS+90)})
    ]);
    if(!rr.ok || !rb.ok) throw new Error('unauthorized');
    rooms = rr.rooms; bookings = rb.bookings;
    render();
  }catch(e){
    $('loading').textContent = 'โหลดไม่สำเร็จ — เช็คการตั้งค่า ⚙︎ หรืออินเทอร์เน็ต';
  }
}

/* ================= render grid ================= */
function render(){
  const days = Array.from({length:DAYS}, (_,i)=>addDays(viewStart,i));
  $('rangeLabel').textContent = thDate(days[0]) + ' – ' + thDate(days[days.length-1]);
  let h = '<tr><th class="roomname">ห้อง</th>';
  for(const d of days) h += `<th class="${d===todayStr()?'today':''}">${thDow(d)}<br>${thDate(d)}</th>`;
  h += '</tr>';
  for(const r of rooms){
    h += `<tr><td class="roomname" title="${r.name}">${r.name}</td>`;
    for(const d of days){
      const b = bookings.find(x => x.room===r.id && x.status==='จอง' && d>=x.checkin && d<x.checkout);
      const past = d < todayStr() ? ' past' : '';
      if(b){
        const cls = (d===b.checkin||d===days[0]?' start':'') + (addDays(d,1)===b.checkout||d===days[days.length-1]?' end':'');
        const nm = (d===b.checkin||d===days[0]) ? `<span class="nm">${b.name}</span>` : '';
        h += `<td class="busy${cls}${past}" data-bid="${b.id}" title="${b.name} · ${thDate(b.checkin)} → ${thDate(b.checkout)}">${nm}</td>`;
      }else{
        h += `<td class="free${past}" data-room="${r.id}" data-date="${d}"></td>`;
      }
    }
    h += '</tr>';
  }
  const cal = $('cal');
  cal.innerHTML = h;
  $('loading').style.display='none'; cal.style.display='table';
  cal.querySelectorAll('td.busy').forEach(td => td.onclick = () => openDetail(td.dataset.bid));
  cal.querySelectorAll('td.free').forEach(td => td.onclick = () => openForm(td.dataset.room, td.dataset.date));

  // เข้าพักคืนนี้ — ชื่อลูกค้า ห้อง เบอร์ วันเข้า-ออก ครบเหมือนสมุด
  const tn = bookings.filter(b => b.status==='จอง' && b.checkin <= todayStr() && todayStr() < b.checkout)
                     .sort((a,b)=>a.room<b.room?-1:1);
  $('tonightHead').textContent = `เข้าพักคืนนี้ · ${thDate(todayStr())} (${tn.length} รายการ)`;
  $('tonight').innerHTML = tn.length ? tn.map(b => {
    const rn = (rooms.find(r=>r.id===b.room)||{}).name || b.room;
    return `<div class="bk" onclick="openDetail('${b.id}')">
      <span class="d">${rn}</span>
      <span style="flex:1"><b>${b.name}</b>${b.phone?` · <a href="tel:${b.phone}" style="color:var(--glow)" onclick="event.stopPropagation()">${b.phone}</a>`:''}
        <br><small style="opacity:.7">เข้า ${thDate(b.checkin)} → ออก ${thDate(b.checkout)}</small></span>
    </div>`;
  }).join('') : '<div style="opacity:.6;padding:8px 2px">คืนนี้ยังไม่มีการจอง</div>';

  // รายการข้างหน้า
  const up = bookings.filter(b => b.status==='จอง' && b.checkout > todayStr())
                     .sort((a,b)=>a.checkin<b.checkin?-1:1).slice(0,25);
  $('upcoming').innerHTML = up.length ? up.map(b => {
    const rn = (rooms.find(r=>r.id===b.room)||{}).name || b.room;
    return `<div class="bk" onclick="openDetail('${b.id}')"><span class="d">${thDate(b.checkin)}→${thDate(b.checkout)}</span><span style="flex:1"><b>${b.name}</b> · ${rn}</span></div>`;
  }).join('') : '<div style="opacity:.6;padding:8px 2px">ยังไม่มีการจองข้างหน้า</div>';
}
$('prevBtn').onclick = () => { viewStart = addDays(viewStart, -7); load(); };
$('nextBtn').onclick = () => { viewStart = addDays(viewStart, 7); load(); };
$('todayBtn').onclick = () => { viewStart = todayStr(); load(); };

/* ================= form ================= */
function openForm(room, date){
  $('fRoom').innerHTML = rooms.map(r => `<option value="${r.id}" ${r.id===room?'selected':''}>${r.name} (${r.capacity} คน · ${r.price}฿)</option>`).join('');
  $('fIn').value = date || todayStr();
  $('fOut').value = addDays(date || todayStr(), 1);
  $('fName').value=''; $('fPhone').value=''; $('fNote').value='';
  $('fBf').value=''; $('fXbed').value=''; $('fDepB').value=''; $('fDepK').value='';
  $('fMsg').className='msg';
  $('backdrop').classList.add('show'); $('formSheet').classList.add('open');
}
$('fabAdd').onclick = () => openForm();
$('fClose').onclick = closeSheets;
$('backdrop').onclick = closeSheets;
function closeSheets(){ $('backdrop').classList.remove('show'); $('formSheet').classList.remove('open'); $('detailSheet').classList.remove('open'); $('userSheet').classList.remove('open'); $('docSheet').classList.remove('open'); }

$('fSave').onclick = async () => {
  const m=$('fMsg'); m.className='msg';
  const parts = [];
  const depB = Number($('fDepB').value) || 0, depK = Number($('fDepK').value) || 0;
  if (depB) parts.push('มัดจำ ' + depB.toLocaleString() + '฿');
  if (depK) parts.push('มัดจำ ' + depK.toLocaleString() + ' กีบ');
  parts.push($('fBf').value ? 'รวมอาหารเช้า' : 'ไม่รวมอาหารเช้า');
  if ($('fXbed').value) parts.push('เตียงเสริม');
  if ($('fNote').value.trim()) parts.push($('fNote').value.trim());
  const p = { action:'add',
    name:$('fName').value.trim(), phone:$('fPhone').value.trim(),
    room:$('fRoom').value, checkin:$('fIn').value, checkout:$('fOut').value, note:parts.join(' · ') };
  if(!p.name || !p.checkin || !p.checkout){ m.className='msg err'; m.textContent='กรอกชื่อและวันที่ให้ครบ'; return; }
  m.className='msg ok'; m.textContent='กำลังบันทึก…';
  try{
    const r = await api(p);
    if(!r.ok){ m.className='msg err'; m.textContent=r.error; return; }
    m.className='msg ok'; m.textContent='บันทึกแล้ว ✓ ' + r.id;
    setTimeout(()=>{ closeSheets(); load(); }, 700);
  }catch(e){ m.className='msg err'; m.textContent='ส่งไม่สำเร็จ ลองใหม่'; }
};

/* ================= detail ================= */
let currentId = null;
function openDetail(id){
  const b = bookings.find(x=>x.id===id) || logBookings.find(x=>x.id===id); if(!b) return;
  currentId = id;
  $('dTitle').textContent = b.name;
  const ln = (k,v) => v ? `<div class="ln"><span class="k">${k}</span><span class="v">${v}</span></div>` : '';
  const noteLines = (b.note||'').split(' · ').filter(Boolean).join('<br>');
  $('dBody').innerHTML =
    ln('ห้อง', roomName(b.room)) +
    ln('เช็คอิน', thDate(b.checkin) + ' (' + thDow(b.checkin) + ')') +
    ln('เช็คเอาท์', thDate(b.checkout) + ' (' + thDow(b.checkout) + ')') +
    ln('จำนวนคืน', nightsOf(b) + ' คืน') +
    ln('เบอร์โทร', b.phone ? `<a href="tel:${b.phone}">${b.phone}</a>` : '') +
    ln('รายละเอียด', noteLines) +
    ln('รับจองโดย', b.staff) +
    ln('จองเมื่อ', b.created) +
    ln('สถานะ', b.status==='จอง' ? 'จอง ✓' : '<span style="color:#ffb0a5">ยกเลิกแล้ว</span>') +
    ln('รหัส', b.id);
  $('dCancel').style.display = b.status==='จอง' ? 'inline-block' : 'none';
  $('dMsg').className='msg';
  $('backdrop').classList.add('show'); $('detailSheet').classList.add('open');
}
$('dClose').onclick = closeSheets;
$('dCancel').onclick = async () => {
  const b = bookings.find(x=>x.id===currentId) || logBookings.find(x=>x.id===currentId);
  const who = b ? `ของ "${b.name}" (${thDate(b.checkin)} → ${thDate(b.checkout)})` : 'นี้';
  if(!confirm('⚠️ ยืนยันยกเลิกการจอง' + who + '?\nยกเลิกแล้วห้องจะกลับเป็นว่างทันที')) return;
  const m=$('dMsg'); m.className='msg ok'; m.textContent='กำลังยกเลิก…';
  try{
    const r = await api({action:'cancel', id:currentId});
    if(!r.ok){ m.className='msg err'; m.textContent=r.error; return; }
    m.className='msg ok'; m.textContent='ยกเลิกแล้ว ✓';
    setTimeout(()=>{ closeSheets(); load(); if(view==='log') loadLog(); }, 600);
  }catch(e){ m.className='msg err'; m.textContent='ส่งไม่สำเร็จ ลองใหม่'; }
};
